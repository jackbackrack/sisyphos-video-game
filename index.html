<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sisyphus</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d18; overflow: hidden; font-family: Georgia, serif; color: #f3e6cf; }
  canvas { display: block; }
  .box { position: absolute; background: rgba(20,12,20,0.55); border-radius: 10px; padding: 10px 14px; }
  #info { top: 16px; left: 16px; min-width: 200px; }
  #info b { font-size: 18px; }
  #info div { font-size: 13px; color: #cdbca3; margin-top: 4px; }
  #slopeBox { top: 16px; left: 50%; transform: translateX(-50%); width: min(380px, 42vw); text-align: center; }
  #progBox { top: 16px; right: 16px; width: 120px; }
  .lbl, .row { font-size: 12px; font-weight: bold; }
  .row { display: flex; justify-content: space-between; }
  .track { position: relative; height: 14px; background: #2a1c22; border-radius: 7px; margin-top: 6px; overflow: hidden; }
  .track.thin { height: 6px; }
  #sfill, #pfill { height: 100%; border-radius: 7px; width: 0; }
  #sdanger { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(224,86,63,0.25); }
  #pfill { background: #c59a6a; }
  .tick { position: absolute; top: -2px; bottom: -2px; width: 3px; background: #ff6a4a; }
  #ahead { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; opacity: 0.9; }
  .legend { font-size: 11px; color: #cdbca3; margin-top: 4px; }
  #hint { position: absolute; bottom: 12px; width: 100%; text-align: center; font-size: 12px; color: rgba(255,240,220,0.85); text-shadow: 0 1px 2px #000; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,6,14,0.45); }
  #panel { background: rgba(34,22,30,0.95); border: 2px solid #c59a6a; border-radius: 16px; padding: 28px 36px; max-width: 600px; text-align: center; }
  #panel h1 { margin: 0 0 6px; font-size: 46px; letter-spacing: 2px; }
  #panel h2 { margin: 0 0 12px; font-size: 36px; }
  #panel p { margin: 6px 0; font-size: 16px; color: #e9dcc8; }
  #panel .sub { font-style: italic; color: #cdbca3; }
  #panel .small { font-size: 14px; color: #cdbca3; }
  #overlay.low { align-items: flex-end; background: none; padding-bottom: 14px; pointer-events: none; }
  #overlay.low #panel { padding: 8px 22px; max-width: 900px; background: rgba(34,22,30,0.75); border-width: 1px; }
  #overlay.low #panel h2 { font-size: 22px; margin: 0 0 2px; }
  #overlay.low #panel p { margin: 2px 0; font-size: 13px; }
  #overlay.low #panel .go { margin-top: 4px; font-size: 15px; }
  #panel .go { margin-top: 18px; font-weight: bold; font-size: 18px; animation: blink 1s steps(2) infinite; }
  #panel kbd { display: inline-block; min-width: 18px; padding: 1px 6px; border: 1px solid #8a7a66; border-radius: 4px; background: #2a1c22; font-family: inherit; font-size: 13px; }
  @keyframes blink { 50% { color: #ffdf6b; } }
  #flash { position: absolute; inset: 0; background: #c81e14; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">
  <div id="info" class="box"><b id="lvl">Height 0 m</b><div id="stats"></div><div id="alt"></div></div>
  <div id="slopeBox" class="box"><div class="lbl" id="slbl">SLOPE</div>
    <div class="track"><div id="sdanger"></div><div id="sfill"></div><div class="tick" id="stick"></div><div id="ahead"></div></div>
    <div class="legend">bar = under the boulder · white line = just ahead · red = too steep</div></div>
  <div id="progBox" class="box"><div class="row"><span>Uphill</span><span id="compass" style="display:inline-block;font-size:20px;line-height:16px;font-family:sans-serif;color:#ffdf6b">&#x2191;</span></div></div>
  <div id="hint">W forward · S back · A D sidestep · Q E (or ← →) turn · push the boulder the way you face · SPACE jump · SHIFT duck · H hood · P pause</div>
</div>
<div id="flash"></div>
<div id="overlay"><div id="panel"></div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/rock-texture.js"></script>
<script src="vendor/voice-sounds.js"></script>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Tunables. The simulation runs in "units" on the ground plane (x, z) with
// height y. K converts units to 3D world meters. The peak is at x = z = 0.
// ---------------------------------------------------------------------------
const K = 1 / 30;
const R = 38;              // boulder radius
const PW = 11;             // player radius
const PH = 54;             // player height
const VERT = 2.2;          // the mountain is drawn this much steeper than the gameplay slope
const FACET = 40;          // approximate size of the mountain's facets
const G = 220;             // gravity for the rolling boulder
const ROLL_FRICTION = 60;
const ROLL_DRAG = 0.002;    // air and bounce losses: the faster it rolls the more it loses
const PUSH_F = 232;         // the most you can shove (as acceleration of the boulder)...
const PUSH_VMAX = 104;      // ...falling to nothing as it gets up to the speed you can run behind it
const PUSH_FRICTION = 20;   // rolling resistance while you push
const WALK_ACC = 420;       // how quickly you get up to walking speed...
const RUN_MAX = 250;        // ...and keep running forward and you build up to this
const RUN_ACC = 75;         // ...but only gradually (about 1.3 s from a walk to a full sprint)
const RAM = 0.5;            // how much of a run-up carries into the boulder (it is much heavier than you)
const STOP_SPEED = 60;      // a boulder rolling at you faster than this can't be caught
const DUCK_MAX = 190;       // ...and faster than this, ducking won't save you either
const WALK_FWD = 150, WALK_BACK = 170, STRAFE = 140;
const STEER = 2.2;         // how fast (rad/s) you swing around the boulder to push it a new way
const TURN = 1.0;          // how fast (rad/s) Q / E turn you
const SIDE_DRIFT = 22;     // how much a cross-slope pushes the boulder sideways while you push
const JUMP_V = 440, JUMP_G = 1000;
const DUCK_TIME = 0.25;    // a duck only lasts this long...
const DUCK_COOLDOWN = 0.6; // ...and can't be spammed
const IMPACT_WINDOW = 0.12;// after a slipping boulder hits you, this long to duck before you're crushed
const DEG = 180 / Math.PI;

const LIMIT = 40;           // the steepest ground (in degrees) the boulder can be pushed on
const SEED = 4242;
const MAX_ROLL = 320;

// ---------------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------------
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(a, b) { const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------------------------------------------------------------------------
// Audio
// ---------------------------------------------------------------------------
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
  loadClips();
}
function tone(freq, dur, type = "sine", vol = 0.12, slideTo = null, delay = 0) {
  const ac = AC; if (!ac) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 400, delay = 0) {
  const ac = AC; if (!ac) return;
  const len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(ac.destination);
  src.start(ac.currentTime + delay);
}
// Recorded voice: effort grunts and death screams (see CREDITS.md)
const clips = { grunt: [], scream: [] }, lastClip = {};
let clipsLoading = false;
function loadClips() {
  if (clipsLoading || !AC || !window.VOICE) return;
  clipsLoading = true;
  for (const kind of ["grunt", "scream"]) VOICE[kind].forEach((b64, i) => {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    AC.decodeAudioData(bytes.buffer, buf => { clips[kind][i] = buf; }, () => {});
  });
}
function playClip(kind, vol = 1, rate = 1) {
  const ac = AC, list = clips[kind].filter(Boolean);
  if (!ac || !list.length) return;
  let i = Math.floor(Math.random() * list.length);
  if (list.length > 1 && list[i] === lastClip[kind]) i = (i + 1) % list.length;   // don't repeat the same one
  lastClip[kind] = list[i];
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = list[i]; src.playbackRate.value = rate; g.gain.value = vol;
  src.connect(g).connect(ac.destination);
  src.start();
}
const sfx = {
  grunt(effort) { playClip("grunt", 0.55 + 0.4 * effort, 0.96 + Math.random() * 0.08); },   // effort 0..1
  scream() { playClip("scream", 1); },
  crush() { noise(0.6, 0.6, 300); tone(90, 0.5, "sawtooth", 0.2, 30);
            for (let i = 0; i < 5; i++) noise(0.05, 0.5, 2500, 0.03 + i * 0.045); },
  splat() { noise(0.4, 0.45, 600, 0.05); tone(160, 0.3, "sine", 0.15, 50, 0.05); },
  creak() { tone(70, 0.4, "sawtooth", 0.06, 55); },
  lurch() { noise(0.35, 0.5, 220); },
  catch() { noise(0.15, 0.25, 250); },
  jump() { tone(300, 0.15, "sine", 0.06, 500); },
  duck() { tone(500, 0.08, "sine", 0.05, 250); },
  win() { [392, 494, 587, 784].forEach((f, i) => tone(f, 0.5, "triangle", 0.12, null, i * 0.13)); },
};

// ---------------------------------------------------------------------------
// The mountain never ends. u is the distance up the slope: it runs up +z, but
// the contour lines meander from side to side. Bands of cliffs cross it with
// gentler ledges between them, and the bands get taller and steeper as you
// climb. Nothing is built ahead of time: the ground is made a tile at a time
// as you get near it, always the same for the same place.
// ---------------------------------------------------------------------------
const nP = (() => { const r = mulberry(SEED); return Array.from({ length: 10 }, () => r() * 6.28); })();
function waveU(x) { return 200 * Math.sin(x * 0.0016 + nP[0]) + 70 * Math.sin(x * 0.0041 + nP[1]); }
function uAt(x, z) { return z + waveU(x); }
function upDir(x) {   // straight up the slope (across the contours)
  const d = 200 * 0.0016 * Math.cos(x * 0.0016 + nP[0]) + 70 * 0.0041 * Math.cos(x * 0.0041 + nP[1]);
  const l = Math.hypot(d, 1);
  return [d / l, 1 / l];
}

const ROAD_BANK = 45;   // width of the steep bank on each side of a trail
// How hard the mountain is at a given height: 0 at the foot, 1 from about 400 m up
const diffAt = u => clamp(u / 12000, 0, 1);
// The face: steep everywhere (too steep to push the boulder up), a little steeper higher up
const TAN_FOOT = Math.tan(10 / DEG);
function faceTan(u) { return lerp(1.1, 1.3, diffAt(u)); }   // ~48° rising to ~52°
function profSlope(u) {
  if (u < 0) return TAN_FOOT / VERT;
  return lerp(TAN_FOOT, faceTan(u), smooth((u - 40) / 300)) / VERT;
}
const UMIN = -4000;
let prof = new Float32Array(1 << 15), profN = 0;
function profileAt(u) {
  const i = u - UMIN;
  if (i < 0) return UMIN * TAN_FOOT / VERT + i * TAN_FOOT / VERT;
  const i0 = Math.floor(i);
  if (i0 + 2 > profN) {
    if (i0 + 2 > prof.length) {
      let L = prof.length; while (L < i0 + 2) L *= 2;
      const p = new Float32Array(L); p.set(prof.subarray(0, profN)); prof = p;
    }
    for (; profN < i0 + 2; profN++) prof[profN] = profN ? prof[profN - 1] + profSlope(profN - 1 + UMIN) : UMIN * TAN_FOOT / VERT;
  }
  const t = i - i0;
  return prof[i0] * (1 - t) + prof[i0 + 1] * t;
}
// Ribs and gullies running down the face, and broad bulges and hollows
function ridges(x, u) {
  const on = smooth((u - 60) / 400);
  return on * (26 * Math.sin(x * 0.010 + 2.2 * Math.sin(u * 0.0021 + nP[2]) + nP[3]) * (0.65 + 0.35 * Math.sin(u * 0.0013 + nP[4]))
             + 11 * Math.sin(x * 0.023 + u * 0.004 + nP[5])
             + 22 * Math.sin(u * 0.0055 + nP[6]) * Math.sin(x * 0.0037 + nP[7]));
}
// smooth ground, without the small bumps (visual height)
function hBase(x, z) {
  const u = uAt(x, z);
  return profileAt(u) * VERT + ridges(x, u);
}
function hNatural(x, z) {
  return hBase(x, z) + 2 * VERT * (
    Math.sin(x * 0.011 + z * 0.004 + nP[4]) * Math.sin(z * 0.013 - x * 0.005 + nP[5]) +
    0.5 * Math.sin(x * 0.023 + nP[6]) * Math.sin(z * 0.019 + nP[7]));
}

// ---------------------------------------------------------------------------
// Trails. Side by side across the face, each trail switchbacks up its own strip
// of the mountain forever, winding with the rock. At some hairpins the trail
// seems to carry straight on (a spur that turns too steep, washes out or just
// stops), and some hairpins have a steep cut across them: a few of those save
// you a whole leg, the rest are too steep. You can't tell which from below.
// ---------------------------------------------------------------------------
const CHAIN_W = 2000;    // how far apart the trails are
const STRIP = 1000;      // how wide a strip each one zigzags across
const ROAD = { xs: [], zs: [], ys: [], lx: [], lz: [], cam: [], hw: [], tid: [], trails: [], grid: new Map(), gc: 100 };
const gkey = (i, j) => (i + 100000) * 200000 + (j + 100000);
function indexTrail(T) {
  const { xs, zs, grid, gc } = ROAD, reach = T.rh + ROAD_BANK + 5;
  for (let i = T.start; i < T.end - 1; i++) {
    const i0 = Math.floor((Math.min(xs[i], xs[i + 1]) - reach) / gc), i1 = Math.floor((Math.max(xs[i], xs[i + 1]) + reach) / gc);
    const j0 = Math.floor((Math.min(zs[i], zs[i + 1]) - reach) / gc), j1 = Math.floor((Math.max(zs[i], zs[i + 1]) + reach) / gc);
    for (let j = j0; j <= j1; j++) for (let k = i0; k <= i1; k++) {
      const key = gkey(k, j);
      let l = grid.get(key); if (!l) grid.set(key, l = []);
      l.push(i);
    }
  }
}
function pushPt(x, z, y, lxv, lzv, cam, hw, id) {
  const R_ = ROAD;
  R_.xs.push(x); R_.zs.push(z); R_.ys.push(y); R_.lx.push(lxv); R_.lz.push(lzv); R_.cam.push(cam); R_.hw.push(hw); R_.tid.push(id);
}
const _ge = 4;
function gradBase(x, z) {
  return [(hBase(x + _ge, z) - hBase(x - _ge, z)) / (2 * _ge), (hBase(x, z + _ge) - hBase(x, z - _ge)) / (2 * _ge)];
}
// Sideways (toward the drop) and how much the trail tilts that way
function sideAndCamber(dx, dz, gx, gz, tanT, tanC, grade) {
  const gl = Math.hypot(gx, gz);
  let lxv = -dz, lzv = dx;
  if (lxv * gx + lzv * gz > 0) { lxv = -lxv; lzv = -lzv; }
  const across = gl > 1e-5 ? Math.abs(lxv * gx + lzv * gz) / gl : 0;
  const along = Math.abs(grade);   // how steeply the trail itself climbs here
  // tilt like the ground does where that's gentle enough, but no more than keeps it pushable
  const cam = Math.min(gl * across, Math.max(tanC * across, Math.sqrt(Math.max(0, tanT * tanT - along * along))));
  return [lxv, lzv, cam];
}
const trailPar = u => {
  const f = diffAt(u);
  const roadDeg = lerp(27, 31, f), camberDeg = lerp(3, 6, f);
  const tanT = Math.tan(roadDeg / DEG), tanC = Math.tan(camberDeg / DEG);
  return { f, tanT, tanC, tanA: Math.sqrt(tanT * tanT - tanC * tanC), hw: lerp(66, 54, f) };
};
const CHAINS = new Map();
function chainOf(j) {
  let ch = CHAINS.get(j);
  if (ch) return ch;
  const r = mulberry((SEED * 31 + j * 7349) | 0);
  const cx = j * CHAIN_W + (r() - 0.5) * 200;
  const x = cx + (r() - 0.5) * 300, u = -60;
  // Its fate: in every group of three trails at least one goes on forever; the others
  // fail somewhere (low down, or heartbreakingly high up), though they look just as good
  const g = Math.floor(j / 3), sure = Math.floor(mulberry((SEED * 3 + g * 911) | 0)() * 3);
  const goes = ((j % 3) + 3) % 3 === sure || r() < 0.2;
  const failU = goes ? Infinity : 650 + Math.pow(r(), 1.4) * 4500;
  const q = r(), failKind = q < 0.4 ? "steep" : q < 0.75 ? "pinch" : "end";
  ch = { j, r, cx, x, z: u - waveU(x), y: hNatural(x, u - waveU(x)), dx: 0, dz: 1, spin: r() < 0.5 ? 1 : -1, s: 0,
         bound: 0, pts: [], u: u, last: null, legs: 0, pending: [], goes, failU, failKind, dead: false };
  ch.bound = newBound(ch);
  CHAINS.set(j, ch);
  return ch;
}
// where this leg turns back: somewhere near the edge of the strip, so legs vary in length
function newBound(ch) {
  const half = STRIP / 2, m = ch.r() * 220;
  return ch.spin > 0 ? ch.cx - half + m : ch.cx + half - m;   // spin +1 heads toward -x
}
// Extend trail j upward until it reaches u (each batch is its own piece, joined end to end)
function growChain(ch, uTo) {
  const ds = 8;
  while (!ch.dead && ch.u < uTo) {
    if (ch.u >= ch.failU) {   // this is where it gives out
      spur(ch.x, ch.z, ch.y, ch.dx, ch.dz, ch.failKind, 0, trailPar(ch.u), ch.r);
      ROAD.trails[ROAD.trails.length - 1].kind = ch.failKind;
      for (let k = ROAD.trails.length - 2; k >= 0; k--) if (ROAD.trails[k].chain === ch.j) { ROAD.trails[k].kind = "fails"; break; }
      ch.dead = true;
      break;
    }
    const id = ROAD.trails.length, start = ROAD.xs.length;
    if (ch.last) pushPt(...ch.last, id);
    for (let it = 0; it < 160 && ch.u < ch.failU; it++) {
      const p = trailPar(ch.u);
      const [gx, gz] = gradBase(ch.x, ch.z), gl = Math.hypot(gx, gz);
      let ux, uz;
      if (gl > 1e-5) { ux = gx / gl; uz = gz / gl; } else [ux, uz] = upDir(ch.x);
      // switch back at the end of the leg
      if ((ch.spin > 0 && ch.x < ch.bound) || (ch.spin < 0 && ch.x > ch.bound)) {
        ch.pending.push({ at: ch.pts.length, side: ch.spin > 0 ? -1 : 1, s: ch.s });
        ch.spin = -ch.spin; ch.bound = newBound(ch); ch.legs++;
      }
      // climb across the slope at the trail's grade, wandering a little with the rock
      const wob = 0.18 * Math.sin(ch.s * 0.006 + ch.j) + 0.08 * Math.sin(ch.s * 0.017 + ch.j * 2.3);
      // after a hairpin the trail has cut in below the surface: climb a little more gently
      // than the trail allows across the face, so it works its way back up to it
      const deficit = hNatural(ch.x, ch.z) - ch.y;
      const gWant = p.tanA * (deficit > 60 ? 0.7 : deficit > 3 ? 0.83 : 0.97);
      const ph = gl > gWant ? Math.min(deficit > 60 ? 1.38 : 1.27, Math.acos(gWant / gl) * clamp(1 + wob, 0.85, 1.1)) : 0.3;   // never so flat it drifts down into the leg below
      let dx = ux * Math.cos(ph * ch.spin) - uz * Math.sin(ph * ch.spin), dz = ux * Math.sin(ph * ch.spin) + uz * Math.cos(ph * ch.spin);
      // never turn tighter than the trail is wide (hairpins included)
      if (ch.pts.length) {
        const turn = Math.atan2(ch.dx * dz - ch.dz * dx, ch.dx * dx + ch.dz * dz), mt = ds / (p.hw + 14);
        if (Math.abs(turn) > mt) { const a = Math.atan2(ch.dz, ch.dx) + Math.sign(turn) * mt; dx = Math.cos(a); dz = Math.sin(a); }
      }
      ch.dx = dx; ch.dz = dz;
      // the trail follows the ground, but cuts into it or builds up where the ground is
      // steeper than the trail can be (round the hairpins)
      const nx = ch.x + dx * ds, nz = ch.z + dz * ds;
      const ny = clamp(hNatural(nx, nz), ch.y - p.tanA * ds, ch.y + p.tanA * ds);
      const [lxv, lzv, cam] = sideAndCamber(dx, dz, gx, gz, p.tanT, p.tanC, (ny - ch.y) / ds);
      const rec = [ch.x, ch.z, ch.y, lxv, lzv, cam, p.hw];
      pushPt(...rec, id); ch.last = rec; ch.pts.push(ROAD.xs.length - 1);
      ch.x = nx; ch.z = nz; ch.s += ds; ch.y = ny;
      ch.u = uAt(ch.x, ch.z);
    }
    const T = { start, end: ROAD.xs.length, kind: null, rh: 70, chain: ch.j };
    ROAD.trails.push(T);
    indexTrail(T);
    // features at hairpins the trail has now got well past
    while (ch.pending.length && ch.pts.length - ch.pending[0].at > 90) hairpinFeatures(ch, ch.pending.shift());
  }
}
// At a hairpin: maybe a spur carrying straight on, maybe a cut across it
function hairpinFeatures(ch, hp) {

    const sx = Math.round(tx / step) * step, sz = Math.round(tz / step) * step;
    sunLight.target.position.set(sx, hM(sx / K, sz / K) * K, sz);
    sunLight.position.copy(sunLight.target.position).addScaledVector(SUN_DIR, 150);
  }
  sharedU.uPlayer.value.set(P.x * K, P.z * K);
  sharedU.uBoulder.value.set(boulder.position.x, boulder.position.y, boulder.position.z, R * K);
}

// ---------------------------------------------------------------------------
// HUD / overlays
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
function updateHUD() {
  $("hud").style.display = state === "title" ? "none" : "block";
  const u = uAt(B.x, B.z);
  $("lvl").textContent = `Height ${heightOf(B.x, B.z)} m`;
  $("stats").textContent = `Best ${bestH} m · Slips ${stats.slips} · Deaths ${stats.deaths}`;
  $("alt").textContent = `Time ${Math.floor(stats.t / 60)}:${String(Math.floor(stats.t % 60)).padStart(2, "0")}`;

  // Steepness gauge: under the boulder, and a little ahead in the direction you'd push
  const scale = LIMIT * 1.35;
  const s = steepAt(B.x, B.z);
  let ax = B.x - P.x, az = B.z - P.z;
  const al = Math.hypot(ax, az);
  if (al > R + PW + 30 || al < 1) { ax = P.fx; az = P.fz; } else { ax /= al; az /= al; }
  const sa = steepAt(B.x + ax * 70, B.z + az * 70);
  const frac = v => clamp(v / scale, 0, 1) * 100;
  $("sfill").style.width = Math.max(3, frac(s)) + "%";
  $("sfill").style.background = s > LIMIT ? "#e0563f" : s > LIMIT - 4 ? "#e3c14d" : "#7fc66b";
  $("stick").style.left = frac(LIMIT) + "%";
  $("sdanger").style.left = frac(LIMIT) + "%";
  $("ahead").style.left = frac(sa) + "%";
  $("slbl").textContent = `SLOPE ${Math.round(s)}° · ahead ${Math.round(sa)}° · limit ${Math.round(LIMIT)}°`;

  // arrow pointing up the slope, relative to the way you face
  const [ux, uz] = upDir(P.x);
  $("compass").style.transform = `rotate(${(P.heading - Math.atan2(ux, uz)) * DEG}deg)`;
  $("flash").style.opacity = flash * 0.5;
}

function showOverlay() {
  const ov = $("overlay"), p = $("panel");
  if (state === "play") { ov.style.display = "none"; return; }
  ov.style.display = "flex";
  ov.classList.toggle("low", state === "crushed");   // keep the death scene in view
  $("hint").style.display = state === "crushed" ? "none" : "block";
  if (state === "title") {
    p.innerHTML = `<h1>SISYPHUS</h1>
      <p class="sub">Push the boulder to the top of the mountain. Forever.</p><br>
      <p><kbd>W</kbd> forward — push the boulder &nbsp; <kbd>S</kbd> back &nbsp; <kbd>A</kbd> <kbd>D</kbd> sidestep</p>
      <p><kbd>Q</kbd> <kbd>E</kbd> or <kbd>←</kbd> <kbd>→</kbd> turn — steer the boulder while pushing</p>
      <p><kbd>SPACE</kbd> jump — leap back over the boulder</p>
      <p><kbd>SHIFT</kbd> duck — only for a split second, so time it</p>
      <p><kbd>H</kbd> hood up / down</p><br>
      <p class="small">Push it onto ground that's too steep and it slips back down on you.</p>
      <p class="small">Duck the instant it hits — or get out of its way.</p>
      <p class="small">The mountain never ends. Its face is too steep for the boulder: only the trails go up.</p>
      <p class="small">There are endless ways up, but only a few go all the way. Read the rock and choose.</p>
      <p class="small">Read the rock — find the one that goes.</p>
      ${bestH > 0 ? `<p class="small">Highest so far: ${bestH} m</p>` : ""}
      <p class="go">Press SPACE to begin</p>
      <p class="small" style="font-size:11px;margin-top:14px">Voices: VoiceBosch (CC-BY-SA 4.0), creativeheroes, thanvannispen, JohnsonBrandEditing (CC-BY 3.0) — see CREDITS.md</p>`;
  } else if (state === "paused") {
    p.innerHTML = `<h2>Paused</h2><p class="go">P or ESC to resume · R to start again from the bottom</p>`;
  } else if (state === "crushed") {
    p.innerHTML = `<h2 style="color:#e0563f">CRUSHED</h2>
      <p class="sub">The boulder got away from him on ground too steep to hold.</p>
      <p class="small">Height ${heightOf(B.x, B.z)} m · Best ${bestH} m</p>
      <p class="go">SPACE to rise again on the ledge below · R to start from the bottom</p>`;
  }
}

// ---------------------------------------------------------------------------
// Input & loop
// ---------------------------------------------------------------------------
window.addEventListener("keydown", e => {
  audio();
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  const go = e.code === "Space" || e.code === "Enter";
  if (e.code === "KeyH") toggleHood();
  if (state === "title") {
    if (go) newGame();
  } else if (state === "crushed" && death && death.real > 1 && (go || e.code === "KeyR")) {
    if (go) respawn(); else newGame();
  } else if (state === "play") {
    if (e.code === "Space") tryJump();
    else if (e.code === "ShiftLeft" || e.code === "ShiftRight") tryDuck();
    else if (e.code === "KeyP" || e.code === "Escape") state = "paused";
  } else if (state === "paused") {
    if (e.code === "KeyP" || e.code === "Escape") state = "play";
    else if (e.code === "KeyR") newGame();
  }
  showOverlay();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  if (state === "play") { state = "paused"; showOverlay(); }
});

// Title screen shows the foot of the mountain
newGame(); state = "title"; showOverlay();

function renderFrame(dt) {
  shake = Math.max(0, shake - dt * 30);
  flash = Math.max(0, flash - dt * 1.5);
  if (state !== "title") updateTiles(2);
  syncVisuals(dt);
  updateHUD();
  renderer.render(scene, camera);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const steps = Math.ceil(dt / (1 / 120));
  for (let i = 0; i < steps; i++) update(dt / steps);
  if (state === "crushed") updateDeath(dt);
  renderFrame(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
